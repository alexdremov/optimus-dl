name: Mistral PR Agent

on:
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    # SECURITY GATE: 
    # 1. Blocks bot comments.
    # 2. Ensures the comment is on a Pull Request (not a standard Issue).
    # 3. Verifies the commenter is an Owner, Member, or Collaborator.
    # 4. Explicitly checks that the comment contains the "/review" command.
    if: >
      github.event.sender.type != 'Bot' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)

    steps:
      - name: Run PR Agent
        id: pragent
        uses: the-pr-agent/pr-agent@ffe1f89a4dafc7d8e88b9cf010a3233e30b49f43
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL__KEY: ${{ secrets.MISTRAL_API_KEY }}
          
          CONFIG__MODEL: "mistral/mistral-small-latest"
          CONFIG__FALLBACK_MODELS: "mistral/mistral-medium-latest"

          PR_CODE_SUGGESTIONS__COMMITABLE_CODE_SUGGESTIONS: "true"
          PR_REVIEWER__INLINE_CODE_COMMENTS: "true"
